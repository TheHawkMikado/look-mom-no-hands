<!doctype html>
<html><head><meta charset="utf-8"><title>No Hands Browser Runner</title>
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, sans-serif; color: #1c1e21; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; flex: none; }
  .dot.on { background: #2e7d32; } .dot.half { background: #f9a825; }
  label { display: block; font-size: 12px; color: #555; margin-top: 10px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font: 14px ui-monospace, monospace; letter-spacing: 2px; }
  input.port { letter-spacing: 0; font-size: 13px; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #1c1e21; color: #fff; font: 600 13px system-ui; cursor: pointer; }
  .err { color: #c62828; font-size: 12px; margin-top: 6px; }
  .hint { color: #666; font-size: 11px; margin-top: 10px; }
</style></head>
<body>
  <h1>No Hands Browser Runner</h1>
  <div class="row"><span id="dot" class="dot"></span><span id="state">Checking…</span></div>
  <label>Pairing code (shown in Look Ma, No Hands › Agents › Browser)</label>
  <input id="token" maxlength="12" autocomplete="off" placeholder="123456">
  <label>Port</label>
  <input id="port" class="port" placeholder="47831">
  <button id="save">Save & connect</button>
  <div id="err" class="err"></div>
  <div class="hint">Nothing runs on its own. The Mac app plans and asks you before anything that publishes, spends or messages someone; this only reads the page and clicks what it's told.</div>
  <script src="popup.js"></script>
</body></html>
