# Paperclip for No Hands — one container, embedded database, data in ./data.
#
#   ./Scripts/paperclip/up.sh          # start (generates secrets on first run)
#   ./Scripts/paperclip/up.sh down     # stop
#
# The image is the official one; nothing here is a fork. Runs in local
# trusted mode: it listens on your machine only and needs no login. To expose
# it on a VPS, switch PAPERCLIP_DEPLOYMENT_MODE to "authenticated" and put it
# behind TLS — see the Paperclip docs.
services:
  paperclip:
    # Built from a Paperclip checkout (your fork is fine): PAPERCLIP_SRC.
    build:
      context: "${PAPERCLIP_SRC:-../../../paperclip}"
      dockerfile: Dockerfile
    container_name: nohands-paperclip
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERCLIP_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "${PAPERCLIP_DEPLOYMENT_MODE:-local_trusted}"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      PAPERCLIP_API_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?run up.sh, it generates this}"
      PAPERCLIP_AGENT_JWT_SECRET: "${PAPERCLIP_AGENT_JWT_SECRET:?run up.sh, it generates this}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?run up.sh, it generates this}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - "${PAPERCLIP_DATA_DIR:-./data}:/paperclip"
      # The starter agents' scripts, read-only, at a fixed path the bootstrap
      # points the process adapter at.
      - "./agents:/nohands/agents:ro"
